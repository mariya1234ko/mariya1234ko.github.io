
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIIT 운동 타이머</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #111827;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      background: #1f2937;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 22px; text-align: center; font-size: 28px; }
    .settings {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .setting {
      background: #111827;
      padding: 12px;
      border-radius: 14px;
      text-align: center;
    }
    label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
    input {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 10px;
      font-size: 18px;
      text-align: center;
      background: #374151;
      color: white;
    }
    .phase {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin-top: 8px;
    }
    .timer {
      text-align: center;
      font-size: clamp(72px, 18vw, 120px);
      font-weight: 800;
      letter-spacing: -4px;
      margin: 8px 0;
    }
    .round {
      text-align: center;
      color: #d1d5db;
      font-size: 18px;
      margin-bottom: 22px;
    }
    .progress {
      height: 10px;
      background: #374151;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .bar {
      height: 100%;
      width: 100%;
      background: #22c55e;
      transition: width .25s linear, background .2s ease;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    #startBtn { background: #22c55e; color: #052e16; }
    #pauseBtn { background: #f59e0b; color: #422006; }
    #resetBtn { background: #e5e7eb; color: #111827; }
    .hint {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #9ca3af;
    }
    body.rest .phase { color: #60a5fa; }
    body.work .phase { color: #4ade80; }
    @media (max-width: 480px) {
      .settings { grid-template-columns: 1fr; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body class="work">
  <main class="card">
    <h1>HIIT 운동 타이머</h1>

    <section class="settings">
      <div class="setting">
        <label for="workTime">운동 시간 (초)</label>
        <input id="workTime" type="number" min="5" value="30" />
      </div>
      <div class="setting">
        <label for="restTime">휴식 시간 (초)</label>
        <input id="restTime" type="number" min="0" value="30" />
      </div>
      <div class="setting">
        <label for="rounds">라운드</label>
        <input id="rounds" type="number" min="1" value="10" />
      </div>
    </section>

    <div id="phase" class="phase">운동</div>
    <div id="timer" class="timer">30</div>
    <div id="round" class="round">1 / 10 라운드</div>

    <div class="progress"><div id="bar" class="bar"></div></div>

    <div class="buttons">
      <button id="startBtn">시작</button>
      <button id="pauseBtn">일시정지</button>
      <button id="resetBtn">리셋</button>
    </div>

    <div class="hint">기본 설정: 운동 30초 · 휴식 30초 · 10라운드</div>
  </main>

  <script>
    const workInput = document.getElementById('workTime');
    const restInput = document.getElementById('restTime');
    const roundsInput = document.getElementById('rounds');
    const timerEl = document.getElementById('timer');
    const phaseEl = document.getElementById('phase');
    const roundEl = document.getElementById('round');
    const barEl = document.getElementById('bar');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    let interval = null;
    let countdownInterval = null;
    let running = false;
    let countingDown = false;
    let hasStartedSession = false;
    let phase = 'work';
    let currentRound = 1;
    let remaining = Number(workInput.value);
    let phaseTotal = remaining;

    function beep(freq = 880, duration = 140) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
        osc.start();
        osc.stop(ctx.currentTime + duration / 1000);
      } catch (e) {}
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 1.0;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }

    function speakCountdown(number) {
      const words = { 3: 'Three', 2: 'Two', 1: 'One' };
      if (words[number]) speak(words[number]);
    }

    function beginWorkoutInterval() {
      countingDown = false;
      hasStartedSession = true;
      running = true;
      phase = 'work';
      remaining = Math.max(1, Number(workInput.value));
      phaseTotal = remaining;
      speak('Start');
      beep(1040, 180);
      updateDisplay();
      interval = setInterval(tick, 1000);
    }

    function startCountdown() {
      if (countingDown || running) return;
      countingDown = true;
      lockSettings(true);

      let count = 3;
      phaseEl.textContent = '준비';
      timerEl.textContent = count;
      barEl.style.width = '100%';
      barEl.style.background = '#f59e0b';
      speakCountdown(count);

      countdownInterval = setInterval(() => {
        count--;
        if (count > 0) {
          timerEl.textContent = count;
          speakCountdown(count);
        } else {
          clearInterval(countdownInterval);
          countdownInterval = null;
          beginWorkoutInterval();
        }
      }, 1000);
    }

    function updateDisplay() {
      const totalRounds = Math.max(1, Number(roundsInput.value));
      timerEl.textContent = remaining;
      phaseEl.textContent = phase === 'work' ? '운동' : '휴식';
      roundEl.textContent = `${currentRound} / ${totalRounds} 라운드`;
      document.body.className = phase;
      barEl.style.background = phase === 'work' ? '#22c55e' : '#3b82f6';
      const pct = phaseTotal > 0 ? (remaining / phaseTotal) * 100 : 0;
      barEl.style.width = `${Math.max(0, Math.min(100, pct))}%`;
    }

    function lockSettings(lock) {
      workInput.disabled = lock;
      restInput.disabled = lock;
      roundsInput.disabled = lock;
    }

    function finishWorkout() {
      clearInterval(interval);
      interval = null;
      running = false;
      phaseEl.textContent = '완료!';
      timerEl.textContent = '✓';
      barEl.style.width = '0%';
      lockSettings(false);
      speak('You Did It');
      beep(1040, 400);
    }

    function nextPhase() {
      const totalRounds = Math.max(1, Number(roundsInput.value));
      const restTime = Math.max(0, Number(restInput.value));
      const workTime = Math.max(1, Number(workInput.value));

      if (phase === 'work') {
        // 마지막 라운드의 운동이 끝나면 바로 전체 완료입니다.
        if (currentRound >= totalRounds) {
          finishWorkout();
          return;
        }

        if (restTime > 0) {
          phase = 'rest';
          remaining = restTime;
          phaseTotal = restTime;
          speak('Rest');
          beep(660, 180);
        } else {
          currentRound++;
          phase = 'work';
          remaining = workTime;
          phaseTotal = workTime;
          speak('Start');
          beep(920, 180);
        }
      } else {
        currentRound++;
        phase = 'work';
        remaining = workTime;
        phaseTotal = workTime;
        speak('Start');
        beep(920, 180);
      }
      updateDisplay();
    }

    function tick() {
      remaining--;

      // 운동/휴식이 끝나기 3초 전부터 매초 영어 음성 카운트다운.
      if (remaining >= 1 && remaining <= 3) {
        speakCountdown(remaining);
        beep(720, 80);
      }

      if (remaining <= 0) nextPhase();
      else updateDisplay();
    }

    function startTimer() {
      if (running || countingDown) return;

      if (phaseEl.textContent === '완료!') resetTimer();

      // 새 운동 세션을 처음 시작할 때만 3, 2, 1, Start 음성 카운트다운을 실행합니다.
      if (!hasStartedSession) {
        startCountdown();
        return;
      }

      // 일시정지 후 재개할 때는 현재 위치에서 바로 계속합니다.
      lockSettings(true);
      running = true;
      interval = setInterval(tick, 1000);
    }

    function pauseTimer() {
      if (countingDown) {
        clearInterval(countdownInterval);
        countdownInterval = null;
        countingDown = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        lockSettings(false);
        phase = 'work';
        remaining = Math.max(1, Number(workInput.value));
        phaseTotal = remaining;
        updateDisplay();
        return;
      }
      if (!running) return;
      clearInterval(interval);
      interval = null;
      running = false;
      lockSettings(false);
    }

    function resetTimer() {
      clearInterval(interval);
      clearInterval(countdownInterval);
      interval = null;
      countdownInterval = null;
      running = false;
      countingDown = false;
      hasStartedSession = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      phase = 'work';
      currentRound = 1;
      remaining = Math.max(1, Number(workInput.value));
      phaseTotal = remaining;
      lockSettings(false);
      updateDisplay();
    }

    [workInput, restInput, roundsInput].forEach(input => {
      input.addEventListener('change', () => {
        if (!running) resetTimer();
      });
    });

    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);

    updateDisplay();
  </script>
</body>
</html>
