<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>가평 야옹이네 예약 안내</title>
  <style>
    :root{
      --bg:#f7f8fa;
      --card:#ffffff;
      --accent:#0b84ff;
      --text:#222;
      --muted:#666;
    }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background:var(--bg);
      color:var(--text);
      padding:24px;
      -webkit-font-smoothing:antialiased;
    }
    .container{
      max-width:720px;
      margin:0 auto;
    }
    .card{
      background:var(--card);
      border-radius:12px;
      padding:20px;
      box-shadow:0 6px 20px rgba(15,30,50,0.06);
    }
    h1{
      margin:0 0 12px 0;
      font-size:1.25rem;
      color:var(--accent);
    }
    p{margin:8px 0; line-height:1.6}
    .highlight{
      background:linear-gradient(90deg, rgba(11,132,255,0.08), rgba(11,132,255,0.02));
      padding:8px 10px;
      border-radius:8px;
      color:var(--text);
      font-weight:600;
      display:inline-block;
    }
    .list{
      margin:12px 0;
      padding-left:18px;
    }
    .small{
      color:var(--muted);
      font-size:0.95rem;
    }
    .emoji{margin-left:6px}
    
    /* Modern browsers — use aspect-ratio */
    .iframe-aspect {
      width:100%;
      aspect-ratio: 16 / 9;  /* keep 16:9 ratio */
      border:0;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="card" role="article" aria-label="예약 안내">
      <h1>가평 야옹이네 예약 안내</h1>

      <p>안녕하세요.</p>

      <p>예약 가능한 날짜가 표시된 달력입니다. <span class="emoji">🚗</span></p>
      <p>모바일은 가로로 보세요</p>

      <p class="highlight">금액이 적힌 날이 예약 가능한 날입니다.</p>

      <ul class="list">
        <li>표시된 금액은 <strong>2인 기준</strong>입니다.</li>
        <li>1인 추가 시 <strong>₩10,000</strong> (1인당)</li>
        <li>최대 <strong>2인 추가</strong> 가능합니다.</li>
      </ul>

    </div>
  </div>

  <div class="container">

    <iframe class="iframe-aspect" src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Asia%2FSeoul&showPrint=0&showTz=0&showCalendars=0&src=bWFyaXlhMTIzNGtvQGdtYWlsLmNvbQ&src=a28uc291dGhfa29yZWEjaG9saWRheUBncm91cC52LmNhbGVuZGFyLmdvb2dsZS5jb20&color=%23795548&color=%230B8043" style="border:solid 1px #777" width="800" height="600" frameborder="0" scrolling="no"></iframe>
  </div>
</body>
</html>
